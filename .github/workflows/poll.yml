name: Lecture des logs Discord
on:
  schedule:
    - cron: '*/5 * * * *'     # toutes les 5 minutes
  workflow_dispatch: {}        # bouton « Run workflow » pour tester à la main
concurrency:
  group: discord-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install @supabase/supabase-js@2 --no-save --no-audit --no-fund
      - run: node poll.js
        env:
          LOOP_SECONDS: '270'
          INTERVAL_SECONDS: '20'
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
